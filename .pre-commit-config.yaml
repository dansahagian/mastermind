repos:
  - repo: local
    hooks:
      - id: audit
        name: audit
        entry: uv audit --preview-features audit
        language: system
        pass_filenames: false

      - id: lint
        name: lint
        entry: uv run ruff check --fix
        language: system
        pass_filenames: false

      - id: format
        name: format
        entry: uv run ruff format
        language: system
        pass_filenames: false

      - id: types
        name: types
        entry: uv run ty check
        language: system
        pass_filenames: false

      - id: test
        name: test
        entry: uv run pytest .
        language: system
        pass_filenames: false
